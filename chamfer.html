<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>導角引孔計算機</title>
  <style>
    body {
      background-color: #2e2e2e;
      color: #f0f0f0;
      font-family: "Microsoft JhengHei", sans-serif;
      padding: 20px;
    }
    label, select, input {
      font-size: 16px;
      margin: 10px 0;
      display: block;
    }
    input, select {
      padding: 8px;
      width: 200px;
    }
    button {
      padding: 10px 20px;
      font-size: 16px;
      background-color: #4E9A97;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #6DB3B0;
    }
    .result {
      margin-top: 20px;
      font-size: 18px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <h1>導角引孔加工深度計算機</h1>

  <label for="tool">選擇工具角度：</label>
  <select id="angle">
    <option value="90">中心鑽（90°）</option>
    <option value="118">鑽頭（118°）</option>
  </select>

  <label for="diameter">輸入導角直徑 (mm)：</label>
  <input type="number" id="diameter" step="0.01" placeholder="例如：25">

  <button onclick="calculateDepth()">計算深度</button>

  <div class="result" id="result"></div>

  <script>
    function calculateDepth() {
      const angle = parseFloat(document.getElementById("angle").value);
      const diameter = parseFloat(document.getElementById("diameter").value);

      if (isNaN(diameter) || diameter <= 0) {
        document.getElementById("result").innerText = "請輸入有效的導角直徑。";
        return;
      }

      const halfAngleRad = (angle / 2) * (Math.PI / 180);
      const depth = (diameter / 2) / Math.tan(halfAngleRad);

      document.getElementById("result").innerText = `加工深度：約 ${depth.toFixed(2)} mm`;
    }
  </script>
</body>
</html>
