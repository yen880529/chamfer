<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <title>導角引孔計算機</title>
  <link rel="stylesheet" href="ui.css">
</head>
<body>
  <div class="container">
    <h1>導角引孔加工深度計算機</h1>

    <div class="input-group">
      <label for="angle">選擇工具角度：</label>
      <select id="angle">
        <option value="90">中心鑽（90°）</option>
        <option value="118">鑽頭（118°）</option>
      </select>
    </div>

    <div class="input-group">
      <label for="diameter">輸入導角直徑 (mm)：</label>
      <input type="number" id="diameter" step="0.01" placeholder="例如：25">
    </div>

    <div class="button-group">
      <button onclick="calculateDepth()">計算深度</button>
    </div>

    <div class="result" id="result"></div>
  </div>

  <script>
    function calculateDepth() {
      const angle = parseFloat(document.getElementById("angle").value);
      const diameter = parseFloat(document.getElementById("diameter").value);

      if (isNaN(diameter) || diameter <= 0) {
        document.getElementById("result").innerText = "請輸入有效的導角直徑。";
        return;
      }

      const halfAngleRad = (angle / 2) * (Math.PI / 180);
      const depth = (diameter / 2) / Math.tan(halfAngleRad);

      document.getElementById("result").innerText = `加工深度：約 ${depth.toFixed(2)} mm`;
    }
  </script>
</body>
</html>
